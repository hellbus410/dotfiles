  youtube: { type: http, behavior: domain, format: mrs, url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/youtube.mrs, path: ./ruleset/youtube.mrs, proxy: Proxy, interval: 86400 }
  github: { type: http, behavior: domain, format: mrs, url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/github.mrs, path: ./ruleset/github.mrs, proxy: Proxy, interval: 86400 }
  telegram: { type: http, behavior: domain, format: mrs, url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/telegram.mrs, path: ./ruleset/telegram.mrs, proxy: Proxy, interval: 86400 }

  ru-apps: { type: http, behavior: classical, format: yaml, url: https://raw.githubusercontent.com/roscomvpn/custom-category/release/mihomo/ru-apps.yaml, path: ./ruleset/ru-apps.yaml, proxy: Proxy, interval: 86400 }
  torrent-domains: { type: http, behavior: domain, format: mrs, url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/torrent.mrs, path: ./ruleset/torrent-domains.mrs, proxy: Proxy, interval: 86400 }
  torrent-clients: { type: http, behavior: classical, format: yaml, url: https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/main/other/torrent-clients.yaml, path: ./ruleset/torrent-clients.yaml, proxy: Proxy, interval: 86400 }

rules:
  - RULE-SET,private-ips,DIRECT,no-resolve
  # QUIC is dropped so browsers fall back to TCP; QUIC carried over a TCP proxy is slow.
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP
  - RULE-SET,private-domains,DIRECT
  - RULE-SET,torrent-domains,DIRECT
  - RULE-SET,google-play,Proxy
  - RULE-SET,twitch-ads,Proxy
  - RULE-SET,youtube,Proxy
  - RULE-SET,telegram-ips,Proxy,no-resolve
  - RULE-SET,telegram,Proxy
  - RULE-SET,discord,Proxy
  - RULE-SET,github,Proxy
  - RULE-SET,epicgames,DIRECT
  - RULE-SET,origin,DIRECT
  - RULE-SET,riot,DIRECT
  - RULE-SET,escapefromtarkov,DIRECT
  - RULE-SET,steam,DIRECT
  - RULE-SET,faceit,DIRECT
  - RULE-SET,twitch,DIRECT
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,pinterest,DIRECT
  - RULE-SET,category-ru,DIRECT
  - RULE-SET,whitelist,DIRECT
  - RULE-SET,torrent-clients,DIRECT
  - PROCESS-NAME-REGEX,(?i)discord,Proxy
  - PROCESS-NAME-REGEX,(?i)vesktop,Proxy
  - RULE-SET,games,DIRECT
  - RULE-SET,ru-apps,DIRECT
  - RULE-SET,direct-ips,DIRECT
  - MATCH,Proxy

# ~/.config/tmux/tmux.conf
# Rendering/capacity
set -as terminal-features ',xterm-256color:RGB'
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -s set-clipboard on

# Copy mode keys: vi; command prompt keys: emacs (readline-like)
set -g mode-keys vi
set -g status-keys emacs

# Reload this file: prefix+R (unbound in stock tmux)
bind -N 'Reload the configuration' R source-file ~/.config/tmux/tmux.conf

# setup for yazi to work with image previews
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- Theme ---
# Colours, status line and pane borders come from vanzi (plugin below);
# only the bar's position is set here.
set -g status-position top
set -g @theme_variant 'vanzi'
set -g @bg_transparency 'off'
set -g @active_border 'on'

# Flag a window in the list when something happens in it in the background
# (e.g. a build finishes in `main` while you're working in `claude`).
set -g monitor-activity on

# --- Plugins (TPM: https://github.com/tmux-plugins/tpm) ---
# vanzi before continuum: vanzi sets status-right, continuum appends its
# autosave hook to it.
# Note: TPM itself binds prefix+I / prefix+U / prefix+alt+u for plugin
# install, update and clean.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tarquibrian/vanzi'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
# Claude Code comes back with its last conversation in that directory.
set -g @resurrect-processes '"~claude->claude --continue"'

set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'

# --- After the theme ---
# `run` without -b waits for the plugins, so these append to what vanzi set.
# Prefix marker in the right corner, in the status line's own colours reversed.
set -ga status-right '#{?client_prefix, #[reverse] PREFIX #[noreverse],}'
# Z after the name of a window whose pane is zoomed (prefix+z).
set -gwa window-status-format '#{?window_zoomed_flag,Z ,}'
set -gwa window-status-current-format '#{?window_zoomed_flag,Z ,}'

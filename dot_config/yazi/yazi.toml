# Files opened with Enter run detached (orphan), so yazi can quit while they stay open.
# Same as yazi's default "open" opener, plus orphan = true (its "play" opener already has it).
[opener]
open = [
	{ run = "xdg-open %s1", desc = "Open", for = "linux", orphan = true },
]
extract = [
	{ run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
	{ run = 'ouch decompress "$@"', desc = "Extract with ouch", for = "unix" },
]

[open]
    prepend_rules = [
        { url = "*.rar", use = [ "extract", "reveal" ] },
        { mime = "application/vnd.rar", use = [ "extract", "reveal" ] },
        { mime = "application/x-rar*", use = [ "extract", "reveal" ] },
    ]

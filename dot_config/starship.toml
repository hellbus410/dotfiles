# Starship prompt for zsh, laid out like the bash one (~/.bashrc.d/30-prompt.sh):
#    ~/dir   branch !?  ·········· ✘ 1   3s  user@host   12:34:56
#   ❯
# ❯ turns into ❮ in vi normal mode. Needs a Nerd Font for the icons.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$directory$git_branch$git_state$git_status$nix_shell$direnv$fill$status$cmd_duration$username$hostname$time
$character"""

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold blue"
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold green"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"

[nix_shell]
format = "[$symbol$state]($style) "
symbol = " "
style = "bold cyan"

[fill]
symbol = "·"
style = "bright-black"

[status]
disabled = false
format = " [✘ $status]($style)"
style = "bold red"

[cmd_duration]
min_time = 1_000
format = " [ $duration]($style)"
style = "bold blue"

[username]
show_always = true
format = " [$user]($style)"
style_user = "bold yellow"
style_root = "bold red"

[hostname]
ssh_only = false
format = "[@$hostname]($style)"
style = "bold yellow"

[time]
disabled = false
format = " [ $time]($style)"
time_format = "%H:%M:%S"
style = "bold white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

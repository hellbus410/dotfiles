"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$username\
$hostname\
$directory\
${custom.giturl}\
$git_branch\
${custom.git_worktree}\
$git_status\
$kubernetes\
$docker_context\
$nodejs\
$rust\
$golang\
$python\
$nix_shell\
$direnv\
$fill\
$status\
$cmd_duration\
$time
$character"""

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold yellow"
style_root = "bold red"

[hostname]
ssh_only = false
format = "[@$hostname]($style)"
style = "bold yellow"

[directory]
format = "[ $path ]($style)"
style = "bold blue"
truncation_length = 3
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[custom.giturl]
description = "Display symbol for remote Git host"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "codeberg" ]]; then
    GIT_REMOTE_SYMBOL="󰲋 "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL "
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
format = "$output"
require_repo = true
ignore_timeout = true

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold green"

[custom.git_worktree]
description = "Show indicator when inside a git worktree"
command = """
if git rev-parse --git-dir >/dev/null 2>&1; then
    common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
    git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
    if [ "$common_dir" != "$git_dir" ]; then
        echo "⛓ "
    fi
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[$output]($style)"
style = "bold green"
require_repo = true
ignore_timeout = true

[git_status]
format = "[$untracked$staged$modified$renamed$deleted$conflicted$ahead_behind]($style) "
staged     = "[+](green)"
modified   = "[!](yellow)"
renamed    = "[»](blue)"
deleted    = "[-](red)"
untracked  = "[?](red)"
stashed    = "[≡](white)"
conflicted = "[✖](red bold)"
ahead      = "[⇡${count}](cyan)"
behind     = "[⇣${count}](yellow)"
diverged   = "[⇕⇡${ahead_count}⇣${behind_count}](magenta)"

[kubernetes]
disabled = false
format = "[$symbol$context( \\($namespace\\))]($style) "
symbol = "󱃾 "
style = "bold cyan"

[docker_context]
disabled = false
format = "[$symbol$context]($style) "
symbol = " "
style = "bold blue"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"

[python]
symbol = " "
format = "[$symbol($version )]($style)"

[nix_shell]
format = "[$symbol$state]($style) "
symbol = " "
style = "bold cyan"

[fill]
symbol = "‾"
style = "bright-black"

[status]
disabled = false
format = " [✘ $status]($style)"
style = "bold red"

[cmd_duration]
min_time = 1_000
format = " [ $duration]($style)"
style = "bold yellow"

[time]
disabled = false
format = " [ $time]($style)"
time_format = "%H:%M:%S"
style = "bold white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"
